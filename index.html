<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <form class="sign-in" onsubmit="return false">
      <h1>Sign In</h1>

      <div class="socials">
        <a href="#" aria-label="Google">G+</a>
        <a href="#" aria-label="Facebook">f</a>
        <a href="#" aria-label="GitHub">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="#000" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <a href="#" aria-label="LinkedIn">in</a>
      </div>

      <p class="hint">or use your email password</p>
      <input type="email" placeholder="Email">
      <input type="password" placeholder="Password">
      <a class="forgot" href="#">Forget Your Password?</a>
      <button class="btn" type="submit">Sign In</button>
    </form>

    <div class="welcome">
      <h1>Hello, Friend!</h1>
      <p>Register with your personal details to use all of site features</p>
      <button class="btn btn--ghost" type="button">Sign Up</button>
    </div>
  </div>
</body>
</html>
